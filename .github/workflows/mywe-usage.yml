name: My WE usage alerts

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      report:
        description: "Send a full usage report now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mywe-usage
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check usage and send alerts
        env:
          MYWE_SERVICE_NUMBER: ${{ secrets.MYWE_SERVICE_NUMBER }}
          MYWE_PASSWORD: ${{ secrets.MYWE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_REPORT: ${{ inputs.report }}
        run: |
          if [ "$SEND_REPORT" = "true" ]; then
            python usage_monitor.py --report
          else
            python usage_monitor.py
          fi

      - name: Commit state.json if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "State unchanged"
          else
            git commit -m "chore: update usage state [skip ci]"
            git push
          fi

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
